<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maritime Daily Digest</title>
<style>
:root{
--h1:#1F4E79; --h2:#2E75B6; --link:#0563C1; --ink:#1a2230; --muted:#6b7689;
--line:#e4e8ef; --bg:#f5f7fa; --card:#ffffff; --chip:#eef3f9; --accent:#1F4E79;
--acc-red:#b3261e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}

/* Header */
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#1F4E79,#2E75B6);
color:#fff;box-shadow:0 2px 10px rgba(31,78,121,.18)}
.bar{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -6px;transition:background .15s}
.brand:hover{background:rgba(255,255,255,.12)}
.brand:hover b{text-decoration:underline}
.brand:focus-visible{outline:2px solid #ffd34d;outline-offset:2px}
.brand b{font-size:20px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.85}
.spacer{flex:1}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select,.toggle button,#search{font-family:inherit;font-size:13px}
select{padding:7px 10px;border-radius:8px;border:none;background:#ffffff;color:var(--ink);cursor:pointer}
#search{padding:7px 12px;border-radius:8px;border:none;width:180px;outline:none;color:var(--ink)}
.langwrap{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);
padding:4px 6px 4px 10px;border-radius:12px}
.langwrap .lng-ico{font-size:12px;font-weight:700;color:#fff;opacity:.95;white-space:nowrap}
.toggle{display:inline-flex;background:rgba(0,0,0,.20);border-radius:9px;overflow:hidden;
border:2px solid #ffd34d;box-shadow:0 0 0 3px rgba(255,211,77,.30)}
.toggle button{padding:8px 16px;border:none;background:transparent;color:#fff;cursor:pointer;
font-weight:700;font-size:14px;letter-spacing:.3px;transition:background .15s,color .15s}
.toggle button.on{background:#ffd34d;color:#1F4E79;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.toggle button:not(.on):hover{background:rgba(255,255,255,.16)}

/* View tabs (Daily digest / Tonnage) */
.vtabs{background:#fff;border-bottom:1px solid var(--line)}
.vtabs-inner{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px}
.vtab{appearance:none;border:none;background:transparent;font-family:inherit;font-size:13.5px;font-weight:700;
color:var(--muted);padding:11px 16px 9px;cursor:pointer;border-bottom:3px solid transparent;transition:color .15s,border-color .15s}
.vtab:hover{color:var(--h2)}
.vtab.on{color:var(--h1);border-bottom-color:var(--h2)}
.vtab .vt-ico{margin-right:5px}

/* Tonnage figure badge */
.fig{font-size:12.5px;font-weight:700;color:var(--h1);background:#eaf2fb;border:1px solid #cfe0f2;
border-radius:8px;padding:7px 10px;margin:0 0 9px;line-height:1.5}

/* Nav chips — max 2 lines */
nav.cats{background:#fff;border-bottom:1px solid var(--line)}
.cats-inner{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:7px;max-height:82px;overflow-y:auto}
.chip{white-space:nowrap;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--h1);
font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid transparent}
.chip:hover{border-color:var(--h2)}

main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}

.hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:22px;
display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero .big{font-size:26px;font-weight:800;color:var(--h1)}
.hero .sub{color:var(--muted);font-size:14px}
.stats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.stat{text-align:center}
.stat b{display:block;font-size:24px;color:var(--h2)}
.stat span{font-size:12px;color:var(--muted)}

section.sec{margin-bottom:30px;scroll-margin-top:120px}
.sec h2{font-size:19px;color:var(--h1);border-left:5px solid var(--h2);padding-left:10px;margin:0 0 14px}
.sec h2 .viewall{font-size:11.5px;font-weight:700;color:#fff;background:var(--h2);border:none;
border-radius:999px;padding:3px 11px;margin-left:9px;cursor:pointer;vertical-align:middle}
.sec h2 .viewall:hover{background:var(--h1)}
.backbtn{font-size:13px;font-weight:700;color:#fff;background:var(--h2);border:none;border-radius:8px;
padding:8px 15px;cursor:pointer}
.backbtn:hover{background:var(--h1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 6px 20px rgba(31,78,121,.10);transform:translateY(-2px)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.code{font-size:11px;font-weight:700;color:#fff;background:var(--h2);padding:2px 7px;border-radius:6px}
.card.acc .code{background:var(--acc-red)}
.meta{font-size:11px;color:var(--muted);margin-left:auto}
.card h3{font-size:15px;margin:0 0 8px;color:var(--ink);line-height:1.4}
.card p{margin:0 0 8px;font-size:13.5px;color:#37425a}
.lab{font-weight:700;color:var(--h1)}
.lab.cause{color:var(--acc-red)}
.impl{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:8px;padding:7px 10px;margin-top:auto}
.src{margin-top:9px;font-size:12px;word-break:break-all}

footer{max-width:1180px;margin:0 auto;padding:18px 16px 50px;color:var(--muted);font-size:12px;text-align:center}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:24px 0 8px}
.pager .pg{min-width:34px;height:34px;padding:0 10px;border:1px solid var(--line);background:#fff;color:var(--h1);
border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.pager .pg:hover:not(:disabled){border-color:var(--h2);background:var(--chip)}
.pager .pg.on{background:var(--h2);color:#fff;border-color:var(--h2)}
.pager .pg:disabled{opacity:.4;cursor:default}
.pager .pg-ell{color:var(--muted);padding:0 2px}

@media (max-width:640px){
.grid{grid-template-columns:1fr}
#search{width:130px}
.vtabs-inner{padding:0 8px}
.vtab{padding:10px 11px 8px;font-size:12.5px}
}
@media print{
header,nav.cats,.vtabs,.ctrl,.hero .stats{display:none}
.card{break-inside:avoid;box-shadow:none}
body{background:#fff}
}
</style>
</head>
<body>
<header>
<div class="bar">
<div class="brand" id="brandHome" role="button" tabindex="0" title="처음 화면으로 (새로고침) / Home (refresh)"><b>⚓ Maritime Daily Digest</b><span>해운 일일 동향 · 카테고리별 뉴스</span></div>
<div class="spacer"></div>
<div class="ctrl">
<input id="search" type="search" placeholder="검색 / Search…" autocomplete="off">
<select id="dateSel" title="날짜 선택"></select>
<div class="langwrap" title="KR / EN 표시 언어 전환">
<span class="lng-ico">🌐 언어</span>
<div class="toggle" id="langToggle">
<button id="btnKR" class="on">KR</button>
<button id="btnEN">EN</button>
</div>
</div>
</div>
</div>
</header>

<div class="vtabs"><div class="vtabs-inner">
<button class="vtab on" id="tabDaily"><span class="vt-ico">📰</span><span id="tabDailyTxt">일일 다이제스트</span></button>
<button class="vtab" id="tabTon"><span class="vt-ico">📊</span><span id="tabTonTxt">선복량·건조량</span></button>
</div></div>

<nav class="cats"><div class="cats-inner" id="catNav"></div></nav>

<main id="main">
<div class="empty" id="loading">불러오는 중…</div>
</main>

<footer id="foot"></footer>

<script>document.write('<scr'+'ipt src="manifest.js?v='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>
/* ---------- config ---------- */
var CAT = {
TOP:{i:"🌐",kr:"Top News",en:"Top News"},
ACC:{i:"🚨",kr:"사고",en:"Accidents"},
PSC:{i:"🛂",kr:"PSC",en:"PSC"},
PCTC:{i:"🚢",kr:"PCTC",en:"PCTC"},
WW:{i:"🟦",kr:"Wallenius",en:"Wallenius"},
EE:{i:"⚡",kr:"에너지효율",en:"Energy"},
DIG:{i:"💻",kr:"디지털",en:"Digital"},
TECH:{i:"🔧",kr:"기술팀",en:"Technical"},
HR:{i:"👥",kr:"Marine HR",en:"Marine HR"},
HSEQ:{i:"🛡️",kr:"HSEQ",en:"HSEQ"},
KR:{i:"🇰🇷",kr:"한국해운",en:"Korea"},
INS:{i:"🛟",kr:"P&I·H&M 보험",en:"Insurance"},
PNI:{i:"⚓",kr:"P&I 클럽",en:"P&I Clubs"},
VET:{i:"✅",kr:"Vetting",en:"Vetting"},
CLASS:{i:"🏛️",kr:"선급",en:"Class"},
COMM:{i:"💰",kr:"커머셜·용선",en:"Commercial"},
GEO:{i:"🗺️",kr:"지리이슈",en:"Geo Issue"},
TW:{i:"📰",kr:"TradeWinds",en:"TradeWinds"},
HOT:{i:"🔥",kr:"LL 핫토픽",en:"LL Hot Topics"},
SYS:{i:"🖥️",kr:"System & App",en:"System & App"},
SMGR:{i:"🏢",kr:"선박관리사",en:"Ship Manager"}
};
var TGRP = {
OVW:{i:"🌍",kr:"세계 선대",en:"World Fleet"},
PCTC:{i:"🚗",kr:"자동차운반선",en:"Car Carriers"},
BULK:{i:"⛴️",kr:"벌크선",en:"Dry Bulk"},
TANK:{i:"🛢️",kr:"탱커",en:"Tankers"},
CONT:{i:"📦",kr:"컨테이너선",en:"Containers"},
GAS:{i:"🔥",kr:"가스선",en:"Gas Carriers"},
YARD:{i:"🏗️",kr:"조선소·건조량",en:"Shipyards"},
SCRAP:{i:"♻️",kr:"해체·선령",en:"Recycling"}
};
var LBL = {
KR:{date:"발표/시기",sum:"주요 내용",imp:"시사점",iDate:"발생/공개",iSum:"사고 개요",cause:"추정 원인",les:"Lessons Learned",src:"출처",fig:"핵심 수치"},
EN:{date:"Date/Source",sum:"Summary",imp:"Implication",iDate:"Incident Date",iSum:"Incident Summary",cause:"Probable Cause",les:"Lessons Learned",src:"Source",fig:"Key figures"}
};
var lang = "KR";
var current = null;
var viewMode = "day"; // "day" | "all" | "tonnage"
var tonnage = null;
var tonLoading = false;
var allCode = null;
var allItems = [];
var allPage = 0;
var DAYS_PER_PAGE = 10; /* archive view: days shown per page */

/* ---------- loader ---------- */
function loadDay(date, cb){
window.DIGEST_ARCHIVE = window.DIGEST_ARCHIVE || {};
if (window.DIGEST_ARCHIVE[date]) return cb(window.DIGEST_ARCHIVE[date]);
var s = document.createElement("script");
s.src = "digest-" + date + ".js?v=" + Date.now();
s.onload = function(){ cb(window.DIGEST_ARCHIVE[date] || null); };
s.onerror = function(){ cb(null); };
document.head.appendChild(s);
}

function loadTonnage(cb){
if(window.TONNAGE) return cb(window.TONNAGE);
if(tonLoading) return;
tonLoading = true;
var s = document.createElement("script");
s.src = "tonnage.js?v=" + Date.now();
s.onload = function(){ tonLoading=false; cb(window.TONNAGE || null); };
s.onerror = function(){ tonLoading=false; cb(null); };
document.head.appendChild(s);
}

function esc(t){ return (t==null?"":String(t)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* source link: always open the ORIGINAL site (no Google Translate) */
function srcTranslated(it){ return false; }
function srcUrl(it){ return it.url; }

/* ---------- card ---------- */
function cardHtml(it, isAcc){
var L = LBL[lang];
var acc = isAcc && (it.kCause!=null || it.eCause!=null);
var showSum = (lang==="KR") || !!it.eTitle || !!it.eSum;
var html = '<div class="card'+(acc?" acc":"")+'">';
html += '<div class="top"><span class="code">'+esc(it.code)+'</span><span class="meta">'+esc(it.src)+' · '+esc(it._adate||it.date||"")+'</span></div>';
var ttl = (lang==="KR") ? (it.titleKR || it.title) : (it.title || it.eTitle || "");
html += '<h3>'+esc(ttl)+'</h3>';
if(acc){
if(showSum) html += '<p><span class="lab">'+L.iSum+':</span> '+esc(lang==="KR"?it.kSum:it.eSum)+'</p>';
html += '<p><span class="lab cause">'+L.cause+':</span> '+esc(lang==="KR"?it.kCause:it.eCause)+'</p>';
html += '<div class="impl"><b>'+L.les+':</b> '+esc(lang==="KR"?it.kLes:it.eLes)+'</div>';
} else {
if(showSum) html += '<p><span class="lab">'+L.sum+':</span> '+esc(lang==="KR"?it.kSum:it.eSum)+'</p>';
html += '<div class="impl"><b>'+L.imp+':</b> '+esc(lang==="KR"?it.kImp:it.eImp)+'</div>';
}
html += '<div class="src">🔗 <a href="'+esc(srcUrl(it))+'" target="_blank" rel="noopener">'+L.src+'</a></div>';
html += '</div>';
return html;
}

/* ---------- render ---------- */
function render(){
if(viewMode==="tonnage") return renderTonnage();
if(viewMode==="all") return renderAll();
return renderDay();
}

function tcardHtml(it){
var L = LBL[lang];
var ttl = (lang==="KR") ? it.title : (it.eTitle || it.title);
var fig = (lang==="KR") ? it.kFig : (it.eFig || it.kFig);
var sum = (lang==="KR") ? it.kSum : (it.eSum || "");
var imp = (lang==="KR") ? it.kImp : (it.eImp || "");
var html = '<div class="card">';
html += '<div class="top"><span class="code">'+esc(it.code)+'</span><span class="meta">'+esc(it.src)+' · '+esc(it.date||"")+'</span></div>';
html += '<h3>'+esc(ttl)+'</h3>';
if(fig) html += '<div class="fig">📊 '+esc(fig)+'</div>';
if(sum) html += '<p><span class="lab">'+L.sum+':</span> '+esc(sum)+'</p>';
if(imp) html += '<div class="impl"><b>'+L.imp+':</b> '+esc(imp)+'</div>';
html += '<div class="src">🔗 <a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+L.src+'</a></div>';
html += '</div>';
return html;
}

function renderTonnage(){
var main = document.getElementById("main");
var q = (document.getElementById("search").value||"").trim().toLowerCase();
if(!tonnage){ main.innerHTML='<div class="empty">'+(lang==="KR"?"선복량 데이터를 불러오지 못했습니다.":"Could not load tonnage data.")+'</div>'; return; }

var html = '<div class="hero">'
+ '<div><div class="big">'+(lang==="KR"?"📊 선복량 · 건조량 동향":"📊 Tonnage & Newbuilding")+'</div>'
+ '<div class="sub">'+(lang==="KR"?"기준일 ":"Updated ")+esc(lang==="KR"?tonnage.updatedKR:tonnage.updatedEN)
+ ' · Clarksons / Hellenic / TradeWinds / Splash / Xinde '+(lang==="KR"?"등":"and others")+'</div></div>'
+ '<div class="stats"><div class="stat"><b>'+tonnage.groups.length+'</b><span>'+(lang==="KR"?"부문":"segments")+'</span></div>'
+ '<div class="stat"><b>'+tonnage.total+'</b><span>'+(lang==="KR"?"항목":"items")+'</span></div></div></div>';

var shown = 0;
tonnage.groups.forEach(function(g){
var items = g.items.filter(function(it){
if(!q) return true;
var hay = (it.title+" "+(it.eTitle||"")+" "+(it.kFig||"")+" "+(it.kSum||"")+" "+(it.kImp||"")+" "+it.src+" "+it.code).toLowerCase();
return hay.indexOf(q) >= 0;
});
if(!items.length) return;
shown += items.length;
html += '<section class="sec" id="tsec-'+g.code+'"><h2>'+esc(lang==="KR"?g.kTitle:g.eTitle)
+ ' <span style="font-size:12px;color:var(--muted);font-weight:400">('+items.length+')</span></h2><div class="grid">';
items.forEach(function(it){ html += tcardHtml(it); });
html += '</div></section>';
});
if(!shown) html += '<div class="empty">'+(lang==="KR"?"검색 결과가 없습니다.":"No results.")+'</div>';
main.innerHTML = html;
}

function renderDay(){
var main = document.getElementById("main");
var q = (document.getElementById("search").value||"").trim().toLowerCase();
if(!current){ main.innerHTML='<div class="empty">데이터가 없습니다.</div>'; return; }

var html = '<div class="hero">'
+ '<div><div class="big">'+(lang==="KR"?current.dateKR:current.dateEN)+' <span style="font-size:14px;color:var(--muted)">(KST)</span></div></div>'
+ '<div class="stats"><div class="stat"><b>'+current.sections.length+'</b><span>'+(lang==="KR"?"카테고리":"categories")+'</span></div>'
+ '<div class="stat"><b>'+current.total+'</b><span>'+(lang==="KR"?"기사":"items")+'</span></div></div></div>';

var shown = 0;
current.sections.forEach(function(s){
var items = s.items.filter(function(it){
if(!q) return true;
var hay = (it.title+" "+(it.titleKR||"")+" "+(it.kSum||"")+" "+(it.eSum||"")+" "+it.src+" "+it.code).toLowerCase();
return hay.indexOf(q) >= 0;
});
if(!items.length) return;
shown += items.length;
var title = (lang==="KR"?esc(s.kTitle):esc(s.eTitle));
html += '<section class="sec" id="sec-'+s.code+'"><h2>'+title
+ ' <button class="viewall" onclick="viewAll(\''+s.code+'\')">'+(lang==="KR"?"전체보기":"View all")+'</button>'
+ '</h2><div class="grid">';
items.forEach(function(it){ html += cardHtml(it, s.type==="accident"); });
html += '</div></section>';
});

if(!shown) html += '<div class="empty">검색 결과가 없습니다. / No results.</div>';
main.innerHTML = html;
}

function renderAll(){
var main = document.getElementById("main");
var q = (document.getElementById("search").value||"").trim().toLowerCase();
var cat = CAT[allCode] || {i:"",kr:allCode,en:allCode};
var name = (lang==="KR"?cat.kr:cat.en);
var items = allItems.filter(function(it){
if(!q) return true;
var hay = (it.title+" "+(it.titleKR||"")+" "+(it.kSum||"")+" "+(it.eSum||"")+" "+it.src+" "+it.code+" "+(it._adate||"")).toLowerCase();
return hay.indexOf(q) >= 0;
});
/* distinct dates, newest first */
var dseen = {}, dates = [];
items.forEach(function(it){ var d=it._adate||it.date||""; if(!dseen[d]){ dseen[d]=1; dates.push(d); } });
dates.sort(function(a,b){ return a<b?1:(a>b?-1:0); });
var totalPages = Math.max(1, Math.ceil(dates.length / DAYS_PER_PAGE));
if(allPage<0) allPage=0;
if(allPage>totalPages-1) allPage=totalPages-1;
var pageDates = dates.slice(allPage*DAYS_PER_PAGE, allPage*DAYS_PER_PAGE + DAYS_PER_PAGE);
var pset = {}; pageDates.forEach(function(d){ pset[d]=1; });
var pageItems = items.filter(function(it){ return pset[it._adate||it.date||""]; });

var rangeTxt = "";
if(pageDates.length){ var a=pageDates[pageDates.length-1], b=pageDates[0]; rangeTxt = (a===b?b:(b+" ~ "+a)); }
var html = '<div class="hero"><div><div class="big">'+esc(cat.i+" "+name)+'</div>'
+ '<div class="sub">'+(lang==="KR"?"전체보기 · 최신순 · 10일씩":"View all · newest first · 10 days/page")
+ (rangeTxt?(' · '+esc(rangeTxt)):'')+'</div></div>'
+ '<div class="stats"><div class="stat"><b>'+items.length+'</b><span>'+(lang==="KR"?"기사":"items")+'</span></div>'
+ '<div class="stat"><b>'+dates.length+'</b><span>'+(lang==="KR"?"일자":"days")+'</span></div></div></div>';
html += '<div style="margin:-6px 0 16px"><button class="backbtn" onclick="exitAll()">'+(lang==="KR"?"◀ 돌아가기":"◀ Back")+'</button></div>';
if(!pageItems.length){ html += '<div class="empty">'+(lang==="KR"?"데이터가 없습니다.":"No data.")+'</div>'; main.innerHTML=html; return; }
pageDates.forEach(function(d){
var dItems = pageItems.filter(function(it){ return (it._adate||it.date||"")===d; });
if(!dItems.length) return;
html += '<section class="sec"><h2>'+esc(d)+' <span style="font-size:12px;color:var(--muted);font-weight:400">('+dItems.length+')</span></h2><div class="grid">';
dItems.forEach(function(it){ html += cardHtml(it, it.code==="ACC"); });
html += '</div></section>';
});
html += pagerHtml(totalPages);
main.innerHTML = html;
}

function pagerHtml(totalPages){
if(totalPages<=1) return "";
var h = '<div class="pager">';
h += '<button class="pg nav"'+(allPage<=0?' disabled':'')+' onclick="gotoAllPage('+(allPage-1)+')">‹</button>';
var start = Math.max(0, allPage-2), end = Math.min(totalPages-1, allPage+2);
if(start>0){ h += '<button class="pg" onclick="gotoAllPage(0)">1</button>'; if(start>1) h += '<span class="pg-ell">…</span>'; }
for(var p=start;p<=end;p++){ h += '<button class="pg'+(p===allPage?' on':'')+'" onclick="gotoAllPage('+p+')">'+(p+1)+'</button>'; }
if(end<totalPages-1){ if(end<totalPages-2) h += '<span class="pg-ell">…</span>'; h += '<button class="pg" onclick="gotoAllPage('+(totalPages-1)+')">'+totalPages+'</button>'; }
h += '<button class="pg nav"'+(allPage>=totalPages-1?' disabled':'')+' onclick="gotoAllPage('+(allPage+1)+')">›</button>';
h += '</div>';
return h;
}

function gotoAllPage(p){ allPage = p; render(); try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);} }

/* ---------- aggregate one category across the whole archive (date ascending) ---------- */
function loadAllForCode(code, cb){
var dates = (window.DIGEST_MANIFEST||[]).slice().sort();
var acc = [], i = 0;
(function next(){
if(i >= dates.length){
var seen = {}, uniq = [];
acc.forEach(function(it){ var k=(it.url||"").split("?")[0]; if(seen[k]) return; seen[k]=1; uniq.push(it); });
uniq.sort(function(a,b){
if(a._adate > b._adate) return -1;
if(a._adate < b._adate) return 1;
return String(b.date||"").localeCompare(String(a.date||""));
});
return cb(uniq);
}
var d = dates[i++];
loadDay(d, function(dg){
if(dg && dg.sections){
for(var j=0;j<dg.sections.length;j++){
var s = dg.sections[j];
if(s.code === code){
s.items.forEach(function(it){ var o={}; for(var k in it) o[k]=it[k]; o._adate=d; acc.push(o); });
break;
}
}
}
next();
});
})();
}

function viewAll(code){
viewMode = "all"; allCode = code; allPage = 0;
document.getElementById("main").innerHTML = '<div class="empty">전체 아카이브 불러오는 중… / Loading archive…</div>';
loadAllForCode(code, function(items){ allItems = items; render(); try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);} });
}
function exitAll(){ viewMode = "day"; allCode = null; allItems = []; render(); }

/* ---------- brand -> refresh + initial screen ---------- */
function goHome(){
try{
if(location.search || location.hash){ location.replace(location.pathname); }
else { location.reload(); }
}catch(e){ location.reload(); }
}

/* ---------- nav chips ---------- */
function buildNav(){
var nav = document.getElementById("catNav");
if(viewMode==="tonnage"){
if(!tonnage){ nav.innerHTML = ""; return; }
nav.innerHTML = tonnage.groups.map(function(g){
var c = TGRP[g.code] || {i:"",kr:g.code,en:g.code};
return '<span class="chip" onclick="gotoSec(\''+g.code+'\')">'+esc(c.i+" "+(lang==="KR"?c.kr:c.en))+'</span>';
}).join("");
return;
}
if(!current){ nav.innerHTML = ""; return; }
nav.innerHTML = current.sections.map(function(s){
var c = CAT[s.code] || {i:"",kr:s.code,en:s.code};
return '<span class="chip" onclick="gotoSec(\''+s.code+'\')">'+esc(c.i+" "+(lang==="KR"?c.kr:c.en))+'</span>';
}).join("");
}
function gotoSec(code){
var pre = "sec-";
if(viewMode==="tonnage"){ pre = "tsec-"; }
else if(viewMode==="all"){ exitAll(); }
setTimeout(function(){ var el=document.getElementById(pre+code); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }, 40);
}

/* ---------- view tabs ---------- */
function paintTabs(){
document.getElementById("tabDaily").classList.toggle("on", viewMode!=="tonnage");
document.getElementById("tabTon").classList.toggle("on", viewMode==="tonnage");
document.getElementById("dateSel").style.display = (viewMode==="tonnage") ? "none" : "";
document.getElementById("tabDailyTxt").textContent = (lang==="KR") ? "일일 다이제스트" : "Daily Digest";
document.getElementById("tabTonTxt").textContent = (lang==="KR") ? "선복량·건조량" : "Tonnage";
}
function showDaily(){
if(viewMode!=="tonnage") return;
viewMode = "day"; allCode = null; allItems = [];
paintTabs(); buildNav(); render();
try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}
}
function showTonnage(){
if(viewMode==="tonnage") return;
viewMode = "tonnage"; allCode = null; allItems = [];
paintTabs();
document.getElementById("catNav").innerHTML = "";
if(tonnage){ buildNav(); render(); }
else {
document.getElementById("main").innerHTML = '<div class="empty">'+(lang==="KR"?"선복량 데이터 불러오는 중…":"Loading tonnage data…")+'</div>';
loadTonnage(function(d){ tonnage = d; buildNav(); render(); });
}
try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}
}

/* ---------- controls ---------- */
function setLang(l){
lang = l;
document.getElementById("btnKR").classList.toggle("on", l==="KR");
document.getElementById("btnEN").classList.toggle("on", l==="EN");
paintTabs(); buildNav(); render();
}
function selectDate(d){
loadDay(d, function(dg){ current = dg; viewMode = "day"; allCode=null; paintTabs(); buildNav(); render(); });
}

/* ---------- init ---------- */
(function init(){
var man = window.DIGEST_MANIFEST || [];
var sel = document.getElementById("dateSel");
sel.innerHTML = man.map(function(d,i){ return '<option value="'+d+'">'+d+(i===0?" (최신)":"")+'</option>'; }).join("");
document.getElementById("search").addEventListener("input", function(){ if(viewMode==="all") allPage=0; render(); });
document.getElementById("btnKR").addEventListener("click", function(){ setLang("KR"); });
document.getElementById("btnEN").addEventListener("click", function(){ setLang("EN"); });
sel.addEventListener("change", function(){ selectDate(sel.value); });
document.getElementById("tabDaily").addEventListener("click", showDaily);
document.getElementById("tabTon").addEventListener("click", showTonnage);
paintTabs();
var brand = document.getElementById("brandHome");
if(brand){
brand.addEventListener("click", goHome);
brand.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); goHome(); } });
}
document.getElementById("foot").textContent = "Maritime Daily Digest · 자동 생성 · GitHub Pages";
if(man.length){ sel.value = man[0]; selectDate(man[0]); }
else { document.getElementById("main").innerHTML = '<div class="empty">데이터가 없습니다.</div>'; }
})();
</script>
</body>
