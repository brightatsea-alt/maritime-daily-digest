<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maritime Daily Digest</title>
<style>
  :root{
    --h1:#1F4E79; --h2:#2E75B6; --link:#0563C1; --ink:#1a2230; --muted:#6b7689;
    --line:#e4e8ef; --bg:#f5f7fa; --card:#ffffff; --chip:#eef3f9; --accent:#1F4E79;
    --acc-red:#b3261e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}

  /* Header */
  header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#1F4E79,#2E75B6);
    color:#fff;box-shadow:0 2px 10px rgba(31,78,121,.18)}
  .bar{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:20px;letter-spacing:.2px}
  .brand span{font-size:12px;opacity:.85}
  .spacer{flex:1}
  .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  select,.toggle button,#search{font-family:inherit;font-size:13px}
  select{padding:7px 10px;border-radius:8px;border:none;background:#ffffff;color:var(--ink);cursor:pointer}
  #search{padding:7px 12px;border-radius:8px;border:none;width:180px;outline:none;color:var(--ink)}
  /* Language toggle — emphasized */
  .langwrap{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);
    padding:4px 6px 4px 10px;border-radius:12px}
  .langwrap .lng-ico{font-size:12px;font-weight:700;color:#fff;opacity:.95;white-space:nowrap}
  .toggle{display:inline-flex;background:rgba(0,0,0,.20);border-radius:9px;overflow:hidden;
    border:2px solid #ffd34d;box-shadow:0 0 0 3px rgba(255,211,77,.30)}
  .toggle button{padding:8px 16px;border:none;background:transparent;color:#fff;cursor:pointer;
    font-weight:700;font-size:14px;letter-spacing:.3px;transition:background .15s,color .15s}
  .toggle button.on{background:#ffd34d;color:#1F4E79;box-shadow:0 1px 6px rgba(0,0,0,.25)}
  .toggle button:not(.on):hover{background:rgba(255,255,255,.16)}
  @keyframes lngpulse{0%,100%{box-shadow:0 0 0 3px rgba(255,211,77,.30)}
    50%{box-shadow:0 0 0 7px rgba(255,211,77,.55)}}
  .toggle.attn{animation:lngpulse 1.3s ease-in-out 4}
  .trbadge{font-size:10.5px;color:#7a5a00;background:#ffe9a8;border-radius:6px;padding:1px 6px;
    margin-left:5px;font-weight:700;white-space:nowrap}

  /* Nav chips */
  nav.cats{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:40}
  .cats-inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;max-height:32vh;overflow-y:auto}
  .chip{white-space:nowrap;padding:6px 12px;border-radius:999px;background:var(--chip);color:var(--h1);
    font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent}
  .chip:hover{border-color:var(--h2)}

  main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}

  /* Hero */
  .hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:22px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .hero .big{font-size:26px;font-weight:800;color:var(--h1)}
  .hero .sub{color:var(--muted);font-size:14px}
  .stats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
  .stat{text-align:center}
  .stat b{display:block;font-size:24px;color:var(--h2)}
  .stat span{font-size:12px;color:var(--muted)}

  /* Section */
  section.sec{margin-bottom:30px;scroll-margin-top:120px}
  .sec h2{font-size:19px;color:var(--h1);border-left:5px solid var(--h2);padding-left:10px;margin:0 0 14px}
  .sec h2 .viewall{font-size:11.5px;font-weight:700;color:#fff;background:var(--h2);border:none;
    border-radius:999px;padding:3px 11px;margin-left:9px;cursor:pointer;vertical-align:middle}
  .sec h2 .viewall:hover{background:var(--h1)}
  .backbtn{font-size:13px;font-weight:700;color:#fff;background:var(--h2);border:none;border-radius:8px;
    padding:8px 15px;cursor:pointer}
  .backbtn:hover{background:var(--h1)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
    display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
  .card:hover{box-shadow:0 6px 20px rgba(31,78,121,.10);transform:translateY(-2px)}
  .card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .code{font-size:11px;font-weight:700;color:#fff;background:var(--h2);padding:2px 7px;border-radius:6px}
  .card.acc .code{background:var(--acc-red)}
  .meta{font-size:11px;color:var(--muted);margin-left:auto}
  .card h3{font-size:15px;margin:0 0 8px;color:var(--ink);line-height:1.4}
  .card p{margin:0 0 8px;font-size:13.5px;color:#37425a}
  .lab{font-weight:700;color:var(--h1)}
  .lab.cause{color:var(--acc-red)}
  .impl{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:8px;padding:7px 10px;margin-top:auto}
  .src{margin-top:9px;font-size:12px;word-break:break-all}

  footer{max-width:1180px;margin:0 auto;padding:18px 16px 50px;color:var(--muted);font-size:12px;text-align:center}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    #search{width:130px}
    nav.cats{top:auto;position:static}
  }
  @media print{
    header,nav.cats,.ctrl,.hero .stats{display:none}
    .card{break-inside:avoid;box-shadow:none}
    body{background:#fff}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><b>⚓ Maritime Daily Digest</b><span>해운 일일 동향 · 카테고리별 뉴스</span></div>
    <div class="spacer"></div>
    <div class="ctrl">
      <input id="search" type="search" placeholder="검색 / Search…" autocomplete="off">
      <select id="dateSel" title="날짜 선택"></select>
      <div class="langwrap" title="KR: 출처 링크를 한글 번역으로 열기 · EN: 원문 그대로 열기">
        <span class="lng-ico">🌐 언어·출처번역</span>
        <div class="toggle attn" id="langToggle">
          <button id="btnKR" class="on">KR</button>
          <button id="btnEN">EN</button>
        </div>
      </div>
    </div>
  </div>
</header>

<nav class="cats"><div class="cats-inner" id="catNav"></div></nav>

<main id="main">
  <div class="empty" id="loading">불러오는 중…</div>
</main>

<footer id="foot"></footer>

<script src="manifest.js"></script>
<script>
/* ---------- config ---------- */
var CAT = {
  TOP:{i:"🌐",kr:"Top News",en:"Top News"},
  ACC:{i:"🚨",kr:"사고",en:"Accidents"},
  PSC:{i:"🛂",kr:"PSC",en:"PSC"},
  PCTC:{i:"🚢",kr:"PCTC",en:"PCTC"},
  WW:{i:"🟦",kr:"Wallenius",en:"Wallenius"},
  EE:{i:"⚡",kr:"에너지효율",en:"Energy"},
  DIG:{i:"💻",kr:"디지털",en:"Digital"},
  TECH:{i:"🔧",kr:"기술팀",en:"Technical"},
  HR:{i:"👥",kr:"Marine HR",en:"Marine HR"},
  HSEQ:{i:"🛡️",kr:"HSEQ",en:"HSEQ"},
  KR:{i:"🇰🇷",kr:"한국해운",en:"Korea"},
  INS:{i:"🛟",kr:"P&I·H&M 보험",en:"Insurance"},
  PNI:{i:"⚓",kr:"P&I 클럽",en:"P&I Clubs"},
  VET:{i:"✅",kr:"Vetting",en:"Vetting"},
  CLASS:{i:"🏛️",kr:"선급",en:"Class"},
  COMM:{i:"💰",kr:"커머셜·용선",en:"Commercial"},
  GEO:{i:"🗺️",kr:"지리이슈",en:"Geo Issue"},
  TW:{i:"📰",kr:"TradeWinds",en:"TradeWinds"},
  HOT:{i:"🔥",kr:"LL 핫토픽",en:"LL Hot Topics"},
  SYS:{i:"🖥️",kr:"System & App",en:"System & App"},
  SMGR:{i:"🏢",kr:"선박관리사",en:"Ship Manager"}
};
var LBL = {
  KR:{date:"발표/시기",sum:"주요 내용",imp:"시사점",iDate:"발생/공개",iSum:"사고 개요",cause:"추정 원인",les:"Lessons Learned",src:"출처"},
  EN:{date:"Date/Source",sum:"Summary",imp:"Implication",iDate:"Incident Date",iSum:"Incident Summary",cause:"Probable Cause",les:"Lessons Learned",src:"Source"}
};
var lang = "KR";
var current = null;
var viewMode = "day";   // "day" | "all"
var allCode = null;     // section code being shown in all-mode
var allItems = [];      // aggregated items for allCode (date ascending)

/* ---------- loader (file:// friendly) ---------- */
function loadDay(date, cb){
  window.DIGEST_ARCHIVE = window.DIGEST_ARCHIVE || {};
  if (window.DIGEST_ARCHIVE[date]) return cb(window.DIGEST_ARCHIVE[date]);
  var s = document.createElement("script");
  s.src = "digest-" + date + ".js";
  s.onload = function(){ cb(window.DIGEST_ARCHIVE[date] || null); };
  s.onerror = function(){ cb(null); };
  document.head.appendChild(s);
}

function esc(t){ return (t==null?"":String(t)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ---------- source-link translation (KR toggle => Google Translate proxy to Korean) ---------- */
var KO_HOST=/(^|\.)(ksg\.co\.kr|shippingnewsnet\.com|theguru\.co\.kr|finomy\.com|enetnews\.co\.kr|ceoscoredaily\.com|maritimepress\.co\.kr|kobc\.or\.kr|busanpa\.com)$/i;
function isKoreanSource(it){
  if(it && it.code==="KR") return true;
  try{ var a=document.createElement("a"); a.href=it.url; return KO_HOST.test(a.hostname); }catch(e){ return false; }
}
function transUrl(u){
  try{
    var a=document.createElement("a"); a.href=u;
    var ph=a.hostname.replace(/-/g,"--").replace(/\./g,"-")+".translate.goog";
    var sep=a.search?"&":"?";
    return a.protocol+"//"+ph+a.pathname+a.search+sep+"_x_tr_sl=auto&_x_tr_tl=ko&_x_tr_hl=ko"+(a.hash||"");
  }catch(e){ return u; }
}
function srcTranslated(it){ return lang==="KR" && !isKoreanSource(it); }
function srcUrl(it){ return srcTranslated(it) ? transUrl(it.url) : it.url; }

/* ---------- card ---------- */
function cardHtml(it, isAcc){
  var L = LBL[lang];
  var acc = isAcc && (it.kCause!=null || it.eCause!=null);
  var showSum = (lang==="KR") || !!it.eTitle || !!it.eSum;
  var html = '<div class="card'+(acc?" acc":"")+'">';
  html += '<div class="top"><span class="code">'+esc(it.code)+'</span><span class="meta">'+esc(it.src)+' · '+esc(it.date||it._adate||"")+'</span></div>';
  var ttl = (lang==="KR") ? it.title : (it.eTitle || (it.eSum ? String(it.eSum).replace(/\s*\.\s*$/,"") : it.title));
  html += '<h3>'+esc(ttl)+'</h3>';
  if(acc){
    if(showSum) html += '<p><span class="lab">'+L.iSum+':</span> '+esc(lang==="KR"?it.kSum:it.eSum)+'</p>';
    html += '<p><span class="lab cause">'+L.cause+':</span> '+esc(lang==="KR"?it.kCause:it.eCause)+'</p>';
    html += '<div class="impl"><b>'+L.les+':</b> '+esc(lang==="KR"?it.kLes:it.eLes)+'</div>';
  } else {
    if(showSum) html += '<p><span class="lab">'+L.sum+':</span> '+esc(lang==="KR"?it.kSum:it.eSum)+'</p>';
    html += '<div class="impl"><b>'+L.imp+':</b> '+esc(lang==="KR"?it.kImp:it.eImp)+'</div>';
  }
  html += '<div class="src">🔗 <a href="'+esc(srcUrl(it))+'" target="_blank" rel="noopener">'+L.src+'</a>'+(srcTranslated(it)?' <span class="trbadge">🌐 한글</span>':'')+'</div>';
  html += '</div>';
  return html;
}

/* ---------- render (dispatch) ---------- */
function render(){ if(viewMode==="all") return renderAll(); return renderDay(); }

/* ---------- render: single day ---------- */
function renderDay(){
  var main = document.getElementById("main");
  var q = (document.getElementById("search").value||"").trim().toLowerCase();
  if(!current){ main.innerHTML='<div class="empty">데이터가 없습니다.</div>'; return; }

  var html = "";
  html += '<div class="hero">'
    + '<div><div class="big">'+(lang==="KR"?current.dateKR:current.dateEN)+' <span style="font-size:14px;color:var(--muted)">(KST)</span></div></div>'
    + '<div class="stats"><div class="stat"><b>'+current.sections.length+'</b><span>'+(lang==="KR"?"카테고리":"categories")+'</span></div>'
    + '<div class="stat"><b>'+current.total+'</b><span>'+(lang==="KR"?"기사":"items")+'</span></div></div></div>';

  var shown = 0;
  current.sections.forEach(function(s){
    var items = s.items.filter(function(it){
      if(!q) return true;
      var hay = (it.title+" "+(it.kSum||"")+" "+(it.eSum||"")+" "+it.src+" "+it.code).toLowerCase();
      return hay.indexOf(q) >= 0;
    });
    if(!items.length) return;
    shown += items.length;
    var title = (lang==="KR"?esc(s.kTitle):esc(s.eTitle));
    html += '<section class="sec" id="sec-'+s.code+'"><h2>'+title
      + ' <button class="viewall" onclick="viewAll(\''+s.code+'\')">'+(lang==="KR"?"전체보기":"View all")+'</button>'
      + '</h2><div class="grid">';
    items.forEach(function(it){ html += cardHtml(it, s.type==="accident"); });
    html += '</div></section>';
  });

  if(!shown) html += '<div class="empty">검색 결과가 없습니다. / No results.</div>';
  main.innerHTML = html;
}

/* ---------- render: all-archive for one category (date ascending) ---------- */
function renderAll(){
  var main = document.getElementById("main");
  var q = (document.getElementById("search").value||"").trim().toLowerCase();
  var cat = CAT[allCode] || {i:"",kr:allCode,en:allCode};
  var name = (lang==="KR"?cat.kr:cat.en);
  var items = allItems.filter(function(it){
    if(!q) return true;
    var hay = (it.title+" "+(it.kSum||"")+" "+(it.eSum||"")+" "+it.src+" "+it.code+" "+(it._adate||"")).toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  var html = '<div class="hero"><div><div class="big">'+esc(cat.i+" "+name)+'</div>'
    + '<div class="sub">'+(lang==="KR"?"전체보기 · 날짜 오름차순":"View all · date ascending")+'</div></div>'
    + '<div class="stats"><div class="stat"><b>'+items.length+'</b><span>'+(lang==="KR"?"기사":"items")+'</span></div></div></div>';
  html += '<div style="margin:-6px 0 16px"><button class="backbtn" onclick="exitAll()">'+(lang==="KR"?"◀ 돌아가기":"◀ Back")+'</button></div>';
  html += '<section class="sec"><div class="grid">';
  if(!items.length) html += '<div class="empty">'+(lang==="KR"?"데이터가 없습니다.":"No data.")+'</div>';
  items.forEach(function(it){ html += cardHtml(it, it.code==="ACC"); });
  html += '</div></section>';
  main.innerHTML = html;
}

/* ---------- aggregate one category across the whole archive ---------- */
function loadAllForCode(code, cb){
  var dates = (window.DIGEST_MANIFEST||[]).slice().sort(); // ascending YYYY-MM-DD
  var acc = [], i = 0;
  (function next(){
    if(i >= dates.length){
      var seen = {}, uniq = [];
      acc.forEach(function(it){ var k=(it.url||"").split("?")[0]; if(seen[k]) return; seen[k]=1; uniq.push(it); });
      uniq.sort(function(a,b){
        if(a._adate < b._adate) return -1;
        if(a._adate > b._adate) return 1;
        return String(a.date||"").localeCompare(String(b.date||""));
      });
      return cb(uniq);
    }
    var d = dates[i++];
    loadDay(d, function(dg){
      if(dg && dg.sections){
        for(var j=0;j<dg.sections.length;j++){
          var s = dg.sections[j];
          if(s.code === code){
            s.items.forEach(function(it){ var o={}; for(var k in it) o[k]=it[k]; o._adate=d; acc.push(o); });
            break;
          }
        }
      }
      next();
    });
  })();
}

function viewAll(code){
  viewMode = "all"; allCode = code;
  document.getElementById("main").innerHTML = '<div class="empty">전체 아카이브 불러오는 중… / Loading archive…</div>';
  loadAllForCode(code, function(items){ allItems = items; render(); try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);} });
}
function exitAll(){ viewMode = "day"; allCode = null; allItems = []; render(); }

/* ---------- nav chips ---------- */
function buildNav(){
  var nav = document.getElementById("catNav");
  if(!current){ nav.innerHTML = ""; return; }
  nav.innerHTML = current.sections.map(function(s){
    var c = CAT[s.code] || {i:"",kr:s.code,en:s.code};
    return '<span class="chip" onclick="gotoSec(\''+s.code+'\')">'+esc(c.i+" "+(lang==="KR"?c.kr:c.en))+'</span>';
  }).join("");
}
function gotoSec(code){
  if(viewMode==="all") exitAll();
  setTimeout(function(){ var el=document.getElementById("sec-"+code); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }, 40);
}

/* ---------- controls ---------- */
function setLang(l){
  lang = l;
  document.getElementById("btnKR").classList.toggle("on", l==="KR");
  document.getElementById("btnEN").classList.toggle("on", l==="EN");
  buildNav(); render();
}
function selectDate(d){
  loadDay(d, function(dg){ current = dg; viewMode = "day"; allCode=null; buildNav(); render(); });
}

/* ---------- init ---------- */
(function init(){
  var man = window.DIGEST_MANIFEST || [];
  var sel = document.getElementById("dateSel");
  sel.innerHTML = man.map(function(d,i){ return '<option value="'+d+'">'+d+(i===0?" (최신)":"")+'</option>'; }).join("");
  document.getElementById("search").addEventListener("input", function(){ render(); });
  document.getElementById("btnKR").addEventListener("click", function(){ setLang("KR"); });
  document.getElementById("btnEN").addEventListener("click", function(){ setLang("EN"); });
  sel.addEventListener("change", function(){ selectDate(sel.value); });
  document.getElementById("foot").textContent = "Maritime Daily Digest · 자동 생성 · GitHub Pages";
  if(man.length){ sel.value = man[0]; selectDate(man[0]); }
  else { document.getElementById("main").innerHTML = '<div class="empty">데이터가 없습니다.</div>'; }
})();
</script>
</body>
</html>
